<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Project 1_Contact</title>
</head>

<body style="background-color: #ffffff; font-family: Georgia, Arial; text-align: center;margin: 0; padding: 30px 50px;">

    <header>
        <h1 style="color: #333333; font-size: 32px; font-weight: 700;line-height: 1.2; margin: 0 0 15px 0; 
        padding: 0;">Contact</h1>
    </header>

    <nav style="font-size: 15px; font-weight: 600; line-height: 1.4; margin-bottom: 35px; padding: 0; display: flex;
    justify-content: center; gap: 20px;">
        <a href="home.html" style="color: #333333; text-decoration: none;">Home</a>
        <a href="about me.html" style="color: #333333; text-decoration: none;">About</a>
    </nav>

    <main>
        <h2
            style="color: #DE638A; font-size: 26px; font-weight: 700; line-height: 1.3; margin: 35px 0 8px 0; padding: 0; text-align: center;">
            Feel free to get in touch !</h2>
    </main>

    <form action="/Submit" method="post"
        style="color: #333333; font-size: 16px; font-weight: 400; line-height: 1.6; padding: 20px 20px 0 20px;">
        <label for="name" style="display: block; margin-bottom: 6px;">Name</label>
        <input id="name" name="username" type="text" required>
        <label for="email" style="display: block; margin-top: 18px; margin-bottom: 6px;">Email</label>
        <input id="email" name="email" type="email" required>
        <label for="message" style="display: block; margin-top: 18px; margin-bottom: 6px;">Message</label>
        <textarea id="message" name="message" required></textarea>
        <button type="submit" style="display: block; margin: 18px auto 0 auto;">Send</button>
    </form>

    <footer>
        <p
            style="color: #333333; font-size: 13px; font-weight: 400; line-height: 1.4; margin-top: 45px; padding: 15px 0;">
            &copy; 2026 My Website. All rights reserved.</p>
    </footer>

</body>

</html>
